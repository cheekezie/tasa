# Builds the API and web images plus the admin's static files, and deploys all three to the droplet.
# Manual only (Actions → Deploy to droplet → Run workflow) while Render/Railway host Tasa. When the
# droplet becomes production, add a `push: branches: [main]` trigger. Setup: deploy/droplet/README.md.
name: Deploy to droplet

on:
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_URL: https://${{ vars.API_DOMAIN }}/api
      SITE_URL: https://${{ vars.WEB_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      # ── 1. Check ──
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck test --filter=@tasa/api --filter=@tasa/contracts --filter=@tasa/admin --filter=@tasa/web

      # ── 2. Admin static files ──
      - run: pnpm turbo build --filter @tasa/admin
        env:
          VITE_API_URL: ${{ env.API_URL }}

      # ── 3. Images → GitHub Container Registry ──
      - name: Image names
        run: |
          echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasa-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasa-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── 4. Ship to the droplet ──
      - name: Deploy
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key $USER@$HOST"
          scp -i ~/.ssh/deploy_key deploy/droplet/docker-compose.yml deploy/droplet/Caddyfile \
            deploy/droplet/deploy.sh "$USER@$HOST:/opt/tasa/"
          tar -C apps/admin/dist -czf - . | $SSH "set -e; cd /opt/tasa; rm -rf admin.next; mkdir -p admin.next admin; tar -C admin.next -xzf -; find admin -mindepth 1 -delete; cp -a admin.next/. admin/; rm -rf admin.next"
          # (Copied into the existing folder: Caddy's bind mount keeps pointing at it.)
          $SSH "chmod +x /opt/tasa/deploy.sh && /opt/tasa/deploy.sh ${{ github.sha }}"
