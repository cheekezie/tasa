# Tasa on one droplet: Caddy (HTTPS) → API + website, admin served as static files.
# Lives in /opt/tasa next to `.env` (domains, image names/tags) and `api.env` (the API's secrets).
# Mongo and Redis are only reachable inside Docker.
name: tasa

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    image: ${API_IMAGE:?set API_IMAGE in .env}:${API_TAG:-latest}
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_ENV: production
      PORT: 4110
      # Wallet movements run in Mongo transactions, so Mongo is a (single-node) replica set.
      MONGODB_URI: mongodb://mongo:27017/tasa?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    # Also initiates the replica set on first start; afterwards it's just a ping.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Saved to disk, and never evicts keys: queued jobs must not vanish.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  mongo_data:
  redis_data:
